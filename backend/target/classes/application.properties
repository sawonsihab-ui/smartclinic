# SmartClinic+ Spring Boot Application Configuration

spring.application.name=smartclinic-backend
server.port=${PORT:8080}

# Database Configuration (Default H2 in PostgreSQL compatibility mode for seamless zero-setup execution, configurable via DB_URL env)
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartclinicdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# H2 Console (Enabled for local testing/debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External Services
analytics.service.url=${PYTHON_ANALYTICS_URL:http://localhost:8000}
